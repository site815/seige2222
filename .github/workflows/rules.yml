name: Validate game configuration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Configuration validation needs package names, not large binary data.
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node Tools/validate_rules.mjs --self-test
      - run: node Tools/validate_configuration.mjs
      - run: node Tools/test_ai_configuration.mjs
      - run: node Tools/test_combat_configuration.mjs
      - run: node Tools/test_environment_configuration.mjs
      - run: node Tools/test_ui_configuration.mjs
      - run: node Tools/test_wind_configuration.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s Tools -p test_record_verification.py
